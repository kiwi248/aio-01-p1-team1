<div id="login-layout-preview">
  <style>
    #login-layout-preview {
      width: 100%;
      padding: 3rem 1rem;
      color: var(--foreground);
      background: var(--background);
    }
    #login-layout-preview .login-shell {
      width: min(100%, 520px);
      margin: 0 auto;
    }
    #login-layout-preview .login-heading {
      margin-bottom: 2rem;
      text-align: center;
    }
    #login-layout-preview .login-heading h2 {
      margin-bottom: 0.5rem;
    }
    #login-layout-preview .email-row {
      display: grid;
      grid-template-columns: 2fr 1fr;
      gap: 0.75rem;
      margin-bottom: 1rem;
    }
    #login-layout-preview .password-field {
      margin-bottom: 1.5rem;
    }
    #login-layout-preview .action-stack {
      display: grid;
      gap: 0.65rem;
    }
    #login-layout-preview .action-stack .btn {
      width: 100%;
    }
    @media (max-width: 480px) {
      #login-layout-preview {
        padding: 1.5rem 0.25rem;
      }
      #login-layout-preview .email-row {
        grid-template-columns: 1fr;
      }
    }
  </style>

  <section class="login-shell" aria-label="변경할 로그인 화면 예시">
    <header class="login-heading">
      <h2>로그인</h2>
      <p class="text-muted">가입할 때 사용한 이메일과 비밀번호를 입력해 주세요.</p>
    </header>

    <div class="email-row">
      <label class="form-label">
        이메일
        <input class="form-control" type="text" placeholder="이메일 아이디">
      </label>
      <label class="form-label">
        이메일 주소
        <select class="form-select">
          <option>naver.com</option>
          <option>gmail.com</option>
          <option>daum.net</option>
          <option>kakao.com</option>
          <option>직접 입력</option>
        </select>
      </label>
    </div>

    <label class="form-label password-field">
      비밀번호
      <input class="form-control" type="password" placeholder="비밀번호를 입력해 주세요.">
    </label>

    <div class="action-stack">
      <button class="btn btn-primary btn-block" type="button">로그인</button>
      <button class="btn btn-block" type="button">회원가입</button>
    </div>
  </section>
</div>
